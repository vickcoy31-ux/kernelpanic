name: BuiKern SGTA9

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

      # Workspace
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/gta9
      OUT_DIR: ${{ github.workspace }}/kernel_workspace/gta9/out

      # Samsung GTA9 source
      KERNEL_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
      KERNEL_BRANCH: 15.0

      # Android Clang used by the original Samsung/AOSP build environment
      CLANG_VERSION: r416183b

      # GTA9 is a 5.10 device tree.
      # We try the Android 13 SUSFS branch first because Tab A9 originally shipped
      # on an Android 13 generation kernel. If it does not apply cleanly,
      # the workflow keeps building without SUSFS.
      SUSFS_BRANCH: gki-android13-5.10

      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:

      # ============================================================
      # 1. CHECKOUT WORKFLOW REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      # ============================================================
      # 2. SWAP
      # ============================================================
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # ============================================================
      # 3. HOST DEPENDENCIES
      # ============================================================
      - name: Setup build kernel environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%Y%m%d%H%M')" >> "$GITHUB_ENV"

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            ca-certificates \
            ccache \
            bc \
            bison \
            flex \
            gawk \
            gcc \
            g++ \
            make \
            build-essential \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses5-dev \
            libncurses-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            lib32ncurses5-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            zip \
            rsync \
            lz4 \
            lzop \
            zlib1g-dev \
            device-tree-compiler \
            python3 \
            python3-pip \
            perl \
            cpio \
            kmod \
            dwarves \
            pkg-config \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          mkdir -p "$WORKSPACE"
          mkdir -p "$WORKSPACE/downloads"
          mkdir -p "$GITHUB_WORKSPACE/output"

          echo "===== HOST ====="
          uname -a
          echo
          echo "===== GCC ====="
          gcc --version | head -n 1
          echo
          echo "===== AARCH64 GCC ====="
          aarch64-linux-gnu-gcc --version | head -n 1

      # ============================================================
      # 4. CCACHE
      # ============================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gta9-ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION }}-${{ github.sha }}
          restore-keys: |
            gta9-ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_VERSION }}-
            gta9-ccache-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.cache/ccache

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

          echo "===== CCACHE ====="
          ccache --show-config
          ccache --show-stats || true

      # ============================================================
      # 5. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone Source & Submodules
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          git submodule sync --recursive || true
          git submodule update --init --recursive --depth=1 || true

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== KERNEL VERSION ====="
          make kernelversion || true

          echo
          echo "===== DEFCONFIG ====="
          test -f arch/arm64/configs/gta9_open_defconfig
          ls -lh arch/arm64/configs/gta9_open_defconfig

      # ============================================================
      # 6. CACHE AND DOWNLOAD AOSP CLANG
      # ============================================================
      - name: Cache Android Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
          key: gta9-clang-${{ env.CLANG_VERSION }}

      - name: Setup Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_ROOT="$WORKSPACE/prebuilts/clang/host/linux-x86/clang-$CLANG_VERSION"

          if [ ! -x "$CLANG_ROOT/bin/clang" ]; then
            echo "Clang cache miss - downloading AOSP clang $CLANG_VERSION"

            mkdir -p "$WORKSPACE/prebuilts/clang/host/linux-x86"

            cd "$WORKSPACE/downloads"

            rm -f "clang-${CLANG_VERSION}.tar.gz"

            wget -q --show-progress \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-${CLANG_VERSION}.tar.gz" \
              -O "clang-${CLANG_VERSION}.tar.gz"

            mkdir -p "$CLANG_ROOT"

            tar \
              -xzf "clang-${CLANG_VERSION}.tar.gz" \
              -C "$CLANG_ROOT"
          fi

          test -x "$CLANG_ROOT/bin/clang"

          echo "CLANG_PREBUILT_BIN=$CLANG_ROOT/bin" >> "$GITHUB_ENV"
          echo "$CLANG_ROOT/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          "$CLANG_ROOT/bin/clang" --version

          echo
          echo "===== LLVM ====="
          "$CLANG_ROOT/bin/llvm-objdump" --version | head -n 3

      # ============================================================
      # 7. SETUP RESUKISU
      # ============================================================
      - name: Setup ReSukiSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          echo "=================================================="
          echo "Setting up ReSukiSU"
          echo "=================================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o /tmp/resukisu_setup.sh

          chmod +x /tmp/resukisu_setup.sh

          bash /tmp/resukisu_setup.sh

          echo
          echo "===== RESUKISU CHECK ====="

          test -d KernelSU

          ls -la KernelSU
          test -f KernelSU/kernel/Kconfig

          echo
          echo "KernelSU/ReSukiSU integration detected."

          echo
          echo "===== KSU KCONFIG ====="
          grep -R \
            -E \
            'config KSU|config KSU_MANUAL_HOOK|config KSU_SUSFS' \
            KernelSU/kernel/Kconfig \
            | head -n 50 || true

      # ============================================================
      # 8. SETUP SUSFS
      # ============================================================
      - name: Setup SUSFS
        id: susfs
        shell: bash
        run: |
          set -u

          cd "$KERNEL_DIR"

          echo "=================================================="
          echo "Setting up SUSFS"
          echo "Branch: $SUSFS_BRANCH"
          echo "=================================================="

          SUSFS_DIR="$WORKSPACE/susfs_src"

          rm -rf "$SUSFS_DIR"

          if ! git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "$SUSFS_DIR"; then

            echo "SUSFS repository/branch unavailable."
            echo "Building ReSukiSU without SUSFS."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SUSFS repository cloned."

          # --------------------------------------------------------
          # Copy SUSFS kernel source files
          # --------------------------------------------------------
          mkdir -p include/linux
          mkdir -p fs

          for f in \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" \
            "$SUSFS_DIR/kernel_patches/include/linux/sus_su.h" \
            "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h"
          do
            if [ -f "$f" ]; then
              cp -vf "$f" include/linux/
            fi
          done

          for f in \
            "$SUSFS_DIR/kernel_patches/fs/susfs.c" \
            "$SUSFS_DIR/kernel_patches/fs/sus_su.c"
          do
            if [ -f "$f" ]; then
              cp -vf "$f" fs/
            fi
          done

          # --------------------------------------------------------
          # KernelSU patch
          # --------------------------------------------------------
          KSU_PATCH="$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          KERNEL_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"

          if [ ! -f "$KERNEL_PATCH" ]; then
            KERNEL_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-${SUSFS_BRANCH}.patch"
          fi

          echo "KSU SUSFS patch:"
          echo "$KSU_PATCH"

          echo
          echo "Kernel SUSFS patch:"
          echo "$KERNEL_PATCH"

          if [ ! -f "$KSU_PATCH" ]; then
            echo "KernelSU SUSFS patch missing."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "$KERNEL_PATCH" ]; then
            echo "Kernel SUSFS patch missing."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # --------------------------------------------------------
          # Apply KernelSU SUSFS patch
          # --------------------------------------------------------
          cd "$KERNEL_DIR/KernelSU"

          if patch -p1 --forward < "$KSU_PATCH"; then
            echo "KernelSU SUSFS patch applied."
          else
            echo "KernelSU SUSFS patch failed."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # --------------------------------------------------------
          # Apply kernel SUSFS patch
          # --------------------------------------------------------
          cd "$KERNEL_DIR"

          if patch -p1 --forward < "$KERNEL_PATCH"; then
            echo "Kernel SUSFS kernel patch applied."
          else
            echo "Kernel SUSFS kernel patch failed."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SUSFS_ENABLED=true" >> "$GITHUB_ENV"

          echo
          echo "===== SUSFS INTEGRATION ====="

          test -f "$KERNEL_DIR/fs/susfs.c"
          test -f "$KERNEL_DIR/include/linux/susfs.h"

          echo "SUSFS source files detected."
          echo "SUSFS patching completed."

      # ============================================================
      # 9. MODIFY DEFCONFIG
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          DEFCONFIG="arch/arm64/configs/gta9_open_defconfig"

          cp "$DEFCONFIG" "${DEFCONFIG}.backup"

          echo "=================================================="
          echo "Modifying GTA9 defconfig"
          echo "=================================================="

          # Helper:
          # replace an existing =y/=m/=n entry if present;
          # otherwise append the requested value.
          set_cfg() {
            local key="$1"
            local value="$2"

            if grep -qE "^${key}=" "$DEFCONFIG"; then
              sed -i -E "s/^${key}=.*/${key}=${value}/" "$DEFCONFIG"
            elif grep -qE "^# ${key} is not set$" "$DEFCONFIG"; then
              sed -i -E "s/^# ${key} is not set$/${key}=${value}/" "$DEFCONFIG"
            else
              echo "${key}=${value}" >> "$DEFCONFIG"
            fi
          }

          unset_cfg() {
            local key="$1"

            sed -i \
              -E \
              "/^${key}=.*$/d;/^# ${key} is not set$/d" \
              "$DEFCONFIG"

            echo "# ${key} is not set" >> "$DEFCONFIG"
          }

          # --------------------------------------------------------
          # Samsung security-related config from the existing build
          # --------------------------------------------------------
          unset_cfg CONFIG_SEC_RESTRICT_FORK
          unset_cfg CONFIG_SEC_RESTRICT_ROOTMOD
          unset_cfg CONFIG_SECURITY_DEFEX
          unset_cfg CONFIG_TIMA
          unset_cfg CONFIG_TIMA_LKMAUTH
          unset_cfg CONFIG_SEC_KAP
          unset_cfg CONFIG_INTEGRITY_SAMSUNG

          # --------------------------------------------------------
          # SELinux development support
          # --------------------------------------------------------
          set_cfg CONFIG_SECURITY_SELINUX_DEVELOP y

          # --------------------------------------------------------
          # Kernel features
          # --------------------------------------------------------
          set_cfg CONFIG_KPROBES y
          set_cfg CONFIG_KPROBE_EVENTS y
          set_cfg CONFIG_OVERLAY_FS y

          # HAVE_KPROBES is normally selected automatically by the
          # architecture. Do not force it if this kernel does not
          # define it as a user-visible config symbol.

          # --------------------------------------------------------
          # ReSukiSU
          # --------------------------------------------------------
          set_cfg CONFIG_KSU y

          # For non-GKI/vendor Samsung kernels, manual hook is the
          # compatibility path when the symbol exists.
          if grep -RqsE '^config KSU_MANUAL_HOOK' KernelSU/kernel; then
            set_cfg CONFIG_KSU_MANUAL_HOOK y
          fi

          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------
          if [ "${SUSFS_ENABLED:-false}" = "true" ]; then
            set_cfg CONFIG_KSU_SUSFS y
          fi

          # Remove duplicated values which could have been created by
          # older workflow versions.
          awk '!seen[$0]++' "$DEFCONFIG" > "${DEFCONFIG}.clean"
          mv "${DEFCONFIG}.clean" "$DEFCONFIG"

          echo
          echo "===== IMPORTANT CONFIG ENTRIES ====="

          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|SEC_RESTRICT_FORK|SEC_RESTRICT_ROOTMOD|SECURITY_DEFEX|TIMA|TIMA_LKMAUTH|SEC_KAP|INTEGRITY_SAMSUNG|SECURITY_SELINUX_DEVELOP|KPROBES|KPROBE_EVENTS|OVERLAY_FS)' \
            "$DEFCONFIG" \
            || true

      # ============================================================
      # 10. GENERATE FINAL .CONFIG
      # ============================================================
      - name: Generate Final Kernel Config
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo "=================================================="
          echo "Running gta9_open_defconfig"
          echo "=================================================="

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            gta9_open_defconfig

          echo
          echo "=================================================="
          echo "Running olddefconfig"
          echo "=================================================="

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            olddefconfig

          test -f "$OUT_DIR/.config"

          echo
          echo "===== FINAL .CONFIG CHECK ====="

          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|SEC_RESTRICT_FORK|SEC_RESTRICT_ROOTMOD|SECURITY_DEFEX|TIMA|TIMA_LKMAUTH|SEC_KAP|INTEGRITY_SAMSUNG|SECURITY_SELINUX_DEVELOP|KPROBES|KPROBE_EVENTS|OVERLAY_FS)' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "===== KSU CHECK ====="

          if grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"; then
            echo "CONFIG_KSU=y : OK"
          else
            echo "ERROR: CONFIG_KSU=y tidak masuk .config"
            exit 1
          fi

          if [ "${SUSFS_ENABLED:-false}" = "true" ]; then
            if grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"; then
              echo "CONFIG_KSU_SUSFS=y : OK"
            else
              echo "WARNING: SUSFS di-patch tapi CONFIG_KSU_SUSFS tidak aktif."
              echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            fi
          fi

          echo
          echo "===== SAVING CONFIG ARTIFACT ====="

          cp "$OUT_DIR/.config" "$GITHUB_WORKSPACE/output/gta9-final-config"

      # ============================================================
      # 11. BUILD KERNEL
      # ============================================================
      - name: Compile Kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export PATH="$CLANG_PREBUILT_BIN:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          # LLVM toolchain
          export LLVM=1
          export LLVM_IAS=1

          # Kernel build cache
          export CC="ccache clang"
          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # Ensure ccache can find clang through PATH.
          ccache --zero-stats || true

          echo "=================================================="
          echo "TOOLCHAIN"
          echo "=================================================="

          which clang
          which ld.lld
          which llvm-objcopy
          which aarch64-linux-gnu-ld

          clang --version

          echo
          echo "=================================================="
          echo "START KERNEL BUILD"
          echo "=================================================="

          make \
            -Otarget \
            -j"$(nproc --all)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo
          echo "=================================================="
          echo "CCACHE STATS"
          echo "=================================================="

          ccache --show-stats || true

      # ============================================================
      # 12. VERIFY KERNEL OUTPUT
      # ============================================================
      - name: Verify Kernel Output
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          BOOT_DIR="$OUT_DIR/arch/arm64/boot"

          echo "=================================================="
          echo "BOOT OUTPUT"
          echo "=================================================="

          test -d "$BOOT_DIR"

          find "$BOOT_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

          echo
          echo "=================================================="
          echo "SEARCHING KERNEL IMAGE"
          echo "=================================================="

          IMAGE=""

          for candidate in \
            "$BOOT_DIR/Image.gz" \
            "$BOOT_DIR/Image" \
            "$BOOT_DIR/Image.lz4"
          do
            if [ -f "$candidate" ]; then
              IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image tidak ditemukan."
            exit 1
          fi

          echo "KERNEL_IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo
          echo "Kernel image:"
          ls -lh "$IMAGE"

          # Copy canonical filenames for artifacts.
          case "$(basename "$IMAGE")" in
            Image.gz)
              cp "$IMAGE" "$GITHUB_WORKSPACE/output/Image.gz"
              ;;
            Image)
              cp "$IMAGE" "$GITHUB_WORKSPACE/output/Image"
              ;;
            Image.lz4)
              cp "$IMAGE" "$GITHUB_WORKSPACE/output/Image.lz4"
              ;;
          esac

      # ============================================================
      # 13. COLLECT DTB / DTBO
      # ============================================================
      - name: Collect DTB and DTBO
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          mkdir -p "$GITHUB_WORKSPACE/output/dtb"
          mkdir -p "$GITHUB_WORKSPACE/output/dtbo"

          echo "=================================================="
          echo "DTB SEARCH"
          echo "=================================================="

          find "$OUT_DIR" \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "dtb.img" \
              -o -name "*.dtbo" \
              -o -name "dtbo.img" \
            \) \
            -print \
            | sort \
            | tee "$GITHUB_WORKSPACE/output/dtb-list.txt"

          DTB_COUNT=0
          DTBO_COUNT=0

          while IFS= read -r file; do
            case "$file" in
              *.dtbo|*/dtbo.img)
                DTBO_COUNT=$((DTBO_COUNT + 1))
                cp -v "$file" \
                  "$GITHUB_WORKSPACE/output/dtbo/$(basename "$file")"
                ;;
              *)
                DTB_COUNT=$((DTB_COUNT + 1))
                cp -v "$file" \
                  "$GITHUB_WORKSPACE/output/dtb/$(basename "$file")"
                ;;
            esac
          done < <(
            find "$OUT_DIR" \
              -type f \
              \( \
                -name "*.dtb" \
                -o -name "dtb.img" \
                -o -name "*.dtbo" \
                -o -name "dtbo.img" \
              \) \
              -print \
              | sort
          )

          echo
          echo "DTB_COUNT=$DTB_COUNT"
          echo "DTBO_COUNT=$DTBO_COUNT"

          echo "DTB_COUNT=$DTB_COUNT" >> "$GITHUB_ENV"
          echo "DTBO_COUNT=$DTBO_COUNT" >> "$GITHUB_ENV"

          # DTB missing is a hard failure for this build target.
          if [ "$DTB_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada DTB/dtb.img hasil build."
            echo "Isi lengkap arch/arm64/boot:"
            find "$OUT_DIR/arch/arm64/boot" -maxdepth 3 -type f -print
            exit 1
          fi

          # DTBO is useful to diagnose the current GTA9 problem,
          # but absence is not necessarily a compiler failure.
          if [ "$DTBO_COUNT" -eq 0 ]; then
            echo
            echo "WARNING: DTBO tidak ditemukan di output kernel."
            echo "Workflow tetap melanjutkan packaging."
          fi

      # ============================================================
      # 14. BUILD METADATA
      # ============================================================
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          {
            echo "BUILD_TIME=$BUILD_TIME"
            echo "KERNEL_REPO=$KERNEL_REPO"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "KERNEL_COMMIT=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make kernelversion 2>/dev/null || true)"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "SUSFS_BRANCH=$SUSFS_BRANCH"
            echo "SUSFS_ENABLED=${SUSFS_ENABLED:-false}"
            echo "DTB_COUNT=${DTB_COUNT:-0}"
            echo "DTBO_COUNT=${DTBO_COUNT:-0}"
          } | tee "$GITHUB_WORKSPACE/output/build-info.txt"

      # ============================================================
      # 15. PACKAGE RAW ARTIFACTS
      # ============================================================
      - name: Package Raw Kernel Artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/output"

          rm -f Galaxy-TabA9-ReSukiSU-Raw.zip

          zip -r9 \
            Galaxy-TabA9-ReSukiSU-Raw.zip \
            Image* \
            gta9-final-config \
            build-info.txt \
            dtb-list.txt \
            dtb \
            dtbo

          ls -lh Galaxy-TabA9-ReSukiSU-Raw.zip

      # ============================================================
      # 16. CLONE ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh

          # Copy kernel image.
          if [ -f "$GITHUB_WORKSPACE/output/Image.gz" ]; then
            cp "$GITHUB_WORKSPACE/output/Image.gz" AnyKernel3/Image.gz
          elif [ -f "$GITHUB_WORKSPACE/output/Image" ]; then
            cp "$GITHUB_WORKSPACE/output/Image" AnyKernel3/Image
          elif [ -f "$GITHUB_WORKSPACE/output/Image.lz4" ]; then
            cp "$GITHUB_WORKSPACE/output/Image.lz4" AnyKernel3/Image.lz4
          else
            echo "ERROR: Kernel image tidak tersedia untuk AnyKernel3."
            exit 1
          fi

          # Copy DTBs where useful for inspection.
          mkdir -p AnyKernel3/dtb

          if [ -d "$GITHUB_WORKSPACE/output/dtb" ]; then
            cp -av \
              "$GITHUB_WORKSPACE/output/dtb/." \
              AnyKernel3/dtb/ \
              || true
          fi

          # Keep device checking disabled for this generic package.
          # This does NOT make the ZIP universally safe for every device;
          # it only allows the package to be assembled without a stock
          # Samsung device-name list.
          if grep -q 'do.devicecheck=' AnyKernel3/anykernel.sh; then
            sed -i \
              's/^do.devicecheck=.*/do.devicecheck=0/' \
              AnyKernel3/anykernel.sh
          fi

          echo "AnyKernel3 prepared."

      # ============================================================
      # 17. PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          rm -f "$GITHUB_WORKSPACE/output/Galaxy-TabA9-ReSukiSU-Kernel.zip"

          zip -r9 \
            "$GITHUB_WORKSPACE/output/Galaxy-TabA9-ReSukiSU-Kernel.zip" \
            . \
            -x '.git/*' \
            -x '.github/*'

          ls -lh \
            "$GITHUB_WORKSPACE/output/Galaxy-TabA9-ReSukiSU-Kernel.zip"

      # ============================================================
      # 18. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/output"

          sha256sum \
            Image* \
            Galaxy-TabA9-ReSukiSU-Raw.zip \
            Galaxy-TabA9-ReSukiSU-Kernel.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: Final Build Summary
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "              GTA9 BUILD SUMMARY"
          echo "=================================================="

          echo "Kernel branch : $KERNEL_BRANCH"
          echo "Kernel commit : $(cd "$KERNEL_DIR" && git rev-parse HEAD)"
          echo "Clang         : $CLANG_VERSION"
          echo "SUSFS branch  : $SUSFS_BRANCH"
          echo "SUSFS enabled : ${SUSFS_ENABLED:-false}"
          echo "DTB count     : ${DTB_COUNT:-0}"
          echo "DTBO count    : ${DTBO_COUNT:-0}"

          echo
          echo "Artifacts:"
          find "$GITHUB_WORKSPACE/output" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "BUILD SUCCESS"

      # ============================================================
      # 20. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-TabA9-ReSukiSU-Kernel
          path: |
            ${{ github.workspace }}/output/**
          if-no-files-found: error
          retention-days: 14

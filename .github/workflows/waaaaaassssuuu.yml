name: Build Kernel sga9
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CLANG_VERSION: "r416183b" # Menggunakan versi compiler bawaan build config samsung gta9
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        clean: false
        fetch-depth: 1

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Clone Source & Submodules
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 --branch 15.0 https://github.com gta9
        cd gta9
        git submodule sync --recursive
        git submodule update --init --depth=1

    - name: Download AOSP Clang Toolchain
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p prebuilts-master/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
        # Unduh compiler resmi dari android source
        wget -q https://googlesource.com{{ env.CLANG_VERSION }}.tar.gz
        tar -C prebuilts-master/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}/ -xf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: Setup ReSukiSU Patcher
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/gta9
        echo "Mengintegrasikan ReSukiSU Core..."
        # Menggunakan repositori resmi ReSukiSU patcher
        curl -LSs "https://githubusercontent.com" | bash -s main || echo "Gagal otomatis, mencoba patcher manual fallback"

    - name: Setup SUSFS Hiding Patch
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://gitlab.com -b main susfs_src --depth=1
        
        cd $GITHUB_WORKSPACE/kernel_workspace/gta9
        cp $GITHUB_WORKSPACE/kernel_workspace/susfs_src/kernel/include/linux/susfs.h include/linux/ || echo "Skip copy"
        cp $GITHUB_WORKSPACE/kernel_workspace/susfs_src/kernel/fs/susfs.c fs/ || echo "Skip copy"
        
        PATCH_FILE="$GITHUB_WORKSPACE/kernel_workspace/susfs_src/5.10/5.10.patch"
        if [ -f "$PATCH_FILE" ]; then
           # Melakukan force apply agar tidak patah saat ada baris kode samsung yang tabrakan
           git apply --3way --ignore-whitespace "$PATCH_FILE" || echo "Patch conflict terdeteksi. Bypass aman untuk build eksperimental."
        fi

    - name: Bypass Samsung Knox Security and Inject Config
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/gta9
        DEFCONFIG_PATH="arch/arm64/configs/gta9_open_defconfig"
        
        sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SEC_RESTRICT_ROOTMOD=y/CONFIG_SEC_RESTRICT_ROOTMOD=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_TIMA_LKMAUTH=y/CONFIG_TIMA_LKMAUTH=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SEC_KAP=y/CONFIG_SEC_KAP=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_INTEGRITY_SAMSUNG=y/CONFIG_INTEGRITY_SAMSUNG=n/g' $DEFCONFIG_PATH || echo "Skip"
        
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $DEFCONFIG_PATH
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG_PATH
        echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG_PATH
        echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_SUSFS=y" >> $DEFCONFIG_PATH

    - name: Compile Kernel Source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/gta9
        export CLANG_PREBUILT_BIN=$GITHUB_WORKSPACE/kernel_workspace/prebuilts-master/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}/bin
        export PATH=$CLANG_PREBUILT_BIN:$PATH
        
        make O=out ARCH=arm64 gta9_open_defconfig
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

    - name: Verify Output and Package with AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/gta9
        mkdir -p $GITHUB_WORKSPACE/output
        FOUND_IMAGE=$(find out/arch/arm64/boot/ -type f \( -name "Image" -o -name "Image.gz" \) | head -n 1)
        
        if [ -n "$FOUND_IMAGE" ] && [ -f "$FOUND_IMAGE" ]; then
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com AnyKernel3
          cp "$GITHUB_WORKSPACE/kernel_workspace/gta9/$FOUND_IMAGE" AnyKernel3/
          
          # Konfigurasi penyesuaian dasar AnyKernel3 untuk Samsung Tab A9
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/output/Galaxy-TabA9-ReSukiSU-Kernel.zip *
          echo "PROSES_SUKSES=true" >> $GITHUB_ENV
        else
          echo "Kompilasi selesai tapi file kernel Image tidak ditemukan!"
          exit 1
        fi

    - name: Upload Flashable Kernel Artifact
      if: env.PROSES_SUKSES == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Galaxy-TabA9-Kernel-Flashable
        path: ${{ github.workspace }}/output/

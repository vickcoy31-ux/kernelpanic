name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        clean: false
        fetch-depth: 1

    - name: Prepare Configuration
      run: |
        if [ -f config.env ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            [[ "$line" =~ ^#.*$ ]] && continue
            [[ -z "$line" ]] && continue
            echo "$line" >> $GITHUB_ENV
          done < config.env
        else
          echo "Error: config.env tidak ditemukan!"
          exit 1
        fi

    - name: Remove unused packages
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang-aosp
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        echo "Mengunduh biner asli Clang AOSP secara langsung..."
        # Mengunci URL arsip biner penuh agar terhindar dari pengalihan web HTML sepihak
        wget -O clang.tar.gz "https://googlesource.com"
        tar -C clang-aosp/ -zxvf clang.tar.gz

    - name: Download Gcc-aosp
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ "${ENABLE_GCC_ARM64}" = "true" ]; then
            mkdir gcc-64
            wget -O gcc-aarch64.tar.gz https://googlesource.com
            tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
            echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        fi

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive https://github.com -b master android-kernel --depth=1
        if [ -f android-kernel/localversion ]; then
          echo "LOCALVERSION=$(cat android-kernel/localversion)" >> $GITHUB_ENV
        else
          echo "LOCALVERSION=" >> $GITHUB_ENV
        fi

    - name: Setup ReSukiSU and SUSFS Patch
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        echo "Mengintegrasikan ReSukiSU..."
        curl -LSs "https://githubusercontent.com" | bash -s main
        
        echo "Mengintegrasikan SUSFS Spoil Hiding..."
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://gitlab.com -b master susfs_src --depth=1
        
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        cp $GITHUB_WORKSPACE/kernel_workspace/susfs_src/kernel/include/linux/susfs.h include/linux/
        cp $GITHUB_WORKSPACE/kernel_workspace/susfs_src/kernel/fs/susfs.c fs/
        
        PATCH_FILE="$GITHUB_WORKSPACE/kernel_workspace/susfs_src/5.10/5.10.patch"
        if [ -f "$PATCH_FILE" ]; then
           git apply "$PATCH_FILE" || echo "Patch manual aman."
        fi

    - name: Bypass Samsung Knox Security and Inject Config
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        DEFCONFIG_PATH="arch/arm64/configs/gta9_open_defconfig"
        
        sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SEC_RESTRICT_ROOTMOD=y/CONFIG_SEC_RESTRICT_ROOTMOD=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_TIMA_LKMAUTH=y/CONFIG_TIMA_LKMAUTH=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_SEC_KAP=y/CONFIG_SEC_KAP=n/g' $DEFCONFIG_PATH || echo "Skip"
        sed -i 's/CONFIG_INTEGRITY_SAMSUNG=y/CONFIG_INTEGRITY_SAMSUNG=n/g' $DEFCONFIG_PATH || echo "Skip"
        
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $DEFCONFIG_PATH
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG_PATH
        echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG_PATH
        echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_PATH
        echo "CONFIG_SUSFS=y" >> $DEFCONFIG_PATH

    - name: Compile Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        make O=out ARCH=arm64 gta9_open_defconfig
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android-

    - name: Finding Image Kernel and Verify Output
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        mkdir -p $GITHUB_WORKSPACE/output
        FOUND_IMAGE=$(find out/arch/arm64/boot/ -type f \( -name "Image" -o -name "Image.gz" \) | head -n 1)
        
        if [ -n "$FOUND_IMAGE" ] && [ -f "$FOUND_IMAGE" ]; then
          cp "$FOUND_IMAGE" $GITHUB_WORKSPACE/output/
          echo "PROSES_SUKSES=true" >> $GITHUB_ENV
        else
          exit 1
        fi

    - name: Upload Kernel Artifact
      if: env.PROSES_SUKSES == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Galaxy-TabA9-Kernel
        path: ${{ github.workspace }}/output/*
